
<!DOCTYPE html>
<html lang="fr">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AninixType | Entraînement de frappe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 🔵 Bouton À propos -->
  <button onclick="window.location.href='apropos.html'" style="position: fixed; top: 20px; right: 20px; padding: 5px 3px; background-color: #00ffcc; border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #00ffcc;">
    📘 À propos
  </button>
    <header>
      <h1>AnnixTapeType</h1>
      <p>Ave <strong>Aninix-Art</strong> – Apprenez à taper vite et sans faute</p>
     Mode <select id="modeSelector" onchange="changeMode()">
        <option value="pc">PC</option>
        <option value="tablet">Tablette</option>
        <option value="phone">Téléphone</option>
      </select>
    </header>

    <main>
      <div id="phrase" class="phrase"></div>
      <input type="text" id="input" autocomplete="off" placeholder="Tapez ici..." />
      <button id="refresh" style="background: deeppink">🔄 Actualiser</button>
      <div class="stats">
        <span>🚀 Vitesse : <span id="wpm">0</span> MPM</span>
        <span>🎯 Précision : <span id="accuracy">0</span>%</span>
        <span>🔁 Phrases : <span id="count">0</span></span>

    </main>

      &copy; 2025 <strong>Aninix-Art</strong> – Tous droits réservés
    </footer>
  </div>

  <script type="text/javascript" src="script.js"></script>

<style type="text/css">

  body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;

background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;

<script type="text/javascript">const phrases = [
  "Le soleil brille fort aujourd'hui.",
  "Je bois un thé chaud en hiver.",
  "Les enfants jouent dans le jardin.",
  "Il faut écrire sans faire d’erreurs.",
  "Le chat noir saute sur le lit.",
  "Nous partons en voyage demain matin.",
  "La pluie tombe doucement ce soir.",
  "Elle lit un bon roman français.",
  "Apprendre à taper vite est utile.",
  "Le silence est parfois une réponse."
];

const phraseEl = document.getElementById("phrase");
const inputEl = document.getElementById("input");
const wpmEl = document.getElementById("wpm");
const accuracyEl = document.getElementById("accuracy");
const countEl = document.getElementById("count");
const refreshBtn = document.getElementById("refresh");
const keyboardEl = document.getElementById("keyboard");

let currentPhrase = "";
let startTime = null;
let correctChars = 0;
let totalChars = 0;
let phrasesTyped = 0;

function renderKeyboard() {
  const keys = "azertyuiopqsdfghjklmwxcvbnçéèàù,.;!?/:|'".split("");
  keyboardEl.innerHTML = "";
  keys.forEach(k => {
    const keyEl = document.createElement("div");
    keyEl.classList.add("key");
    keyEl.id = "key-" + k;
    keyEl.textContent = k;
    keyboardEl.appendChild(keyEl);
  });
}

function highlightKeyboard(char) {
  const id = "key-" + char;
  const key = document.getElementById(id);
  if (key) {
    key.classList.add("active");
    setTimeout(() => key.classList.remove("active"), 100);
  }
}

function setNewPhrase() {
  currentPhrase = phrases[Math.floor(Math.random() * phrases.length)];
  displayPhrase("");
  inputEl.value = "";
  startTime = new Date();
}

function displayPhrase(input) {
  phraseEl.innerHTML = "";
  for (let i = 0; i < currentPhrase.length; i++) {
    const span = document.createElement("span");
    span.textContent = currentPhrase[i];
    if (input[i]) {
      span.className = input[i] === currentPhrase[i] ? "correct" : "incorrect";
    }
    phraseEl.appendChild(span);
  }
}

function updateStats(input) {
  const timeElapsed = (new Date() - startTime) / 1000 / 60;
  const words = input.trim().split(/\s+/).length;
  const wpm = Math.round(correctChars / 5 / timeElapsed);
  const accuracy = totalChars ? Math.round((correctChars / totalChars) * 100) : 0;

  wpmEl.textContent = isNaN(wpm) ? 0 : wpm;
  accuracyEl.textContent = isNaN(accuracy) ? 0 : accuracy;
  countEl.textContent = phrasesTyped;
}

inputEl.addEventListener("input", () => {
  const input = inputEl.value;
  displayPhrase(input);

  const lastChar = input.slice(-1);
  if (lastChar.match(/[a-zA-Z0-9,.;!?çéèàù ]/)) {
    highlightKeyboard(lastChar);
  }

  totalChars = input.length;
  correctChars = 0;
  for (let i = 0; i < input.length; i++) {
    if (input[i] === currentPhrase[i]) {
      correctChars++;
    }
  }

  updateStats(input);

  if (input === currentPhrase) {
    phrasesTyped++;
    setTimeout(setNewPhrase, 300);
  }
});

refreshBtn.addEventListener("click", () => {
  setNewPhrase();
});

window.onload = () => {
  renderKeyboard();
  setNewPhrase();
  inputEl.focus();
};


// Fonction pour changer le mode de l'application (PC, Tablette, Téléphone)
function changeMode() {
  const mode = document.getElementById("modeSelector").value;
  const app = document.querySelector(".app");

  // Supprimer toutes les classes de taille existantes
  app.classList.remove("tablet", "phone", "pc");

  // Ajouter la classe correspondant au mode sélectionné
  app.classList.add(mode);
}





</script>
